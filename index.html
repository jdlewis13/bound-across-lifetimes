<!DOCTYPE html>

    <title>Bound Across Lifetimes</title>

    <style>

            box-sizing: border-box;
        }

        body {
            margin: 0;

        }

        .site-header {
            position: relative;
            min-height: 260px;
            background-image: url("The%20lightbringer%E2%80%99s%20Rose.png");

    <header class="site-header">
