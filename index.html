<section class="story-evolving">
    <h2>The Story Is Evolving</h2>

    <p>Bound Across Lifetimes began as one story, but somewhere along the way, it became something much larger.</p>

    <p>As the world, history, and characters have grown, I realized the story deserved the same opportunity to grow with them. I am currently undertaking a substantial rewrite of the series, including expanded worldbuilding, deeper character development, and a reworked beginning that better reflects the story it has become.</p>

    <p>During this process, the currently published edition is being temporarily withdrawn, and portions of this website will remain under construction as the new version takes shape.</p>

    <p>This isn't the end of Bound Across Lifetimes.</p>

    <p class="beginning-again">It's the beginning again.</p>
</section>
